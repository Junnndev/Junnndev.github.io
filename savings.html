<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Savings</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172b4d;
            padding: 40px 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 35px;
        }

        .people {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .person {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.06);
        }

        .photo {
            width: 80px;
            height: 80px;
            background: #e8eef7;
            border-radius: 50%;
            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 35px;
        }

        .person h2 {
            font-size: 20px;
            margin-bottom: 8px;
        }

        .savings {
            font-size: 28px;
            font-weight: bold;
            color: #168a70;
        }

        .total {
            margin-top: 20px;
            background: #dff5ee;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
        }

        .total p {
            color: #54706a;
            font-size: 15px;
            margin-bottom: 5px;
        }

        .total h2 {
            font-size: 40px;
            color: #08745d;
        }

        @media (max-width: 600px) {
            .people {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Our Savings</h1>
    <p class="subtitle">Saving together for our future ❤️</p>


    <div class="people">

        <!-- Person 1 -->
        <div class="person">
            <div class="photo">👨🏻</div>

            <h2 id="name1"></h2>

            <div class="savings" id="savings1"></div>
        </div>


        <!-- Person 2 -->
        <div class="person">
            <div class="photo">👩🏻</div>

            <h2 id="name2"></h2>

            <div class="savings" id="savings2"></div>
        </div>

    </div>


    <!-- Total -->
    <div class="total">
        <p>TOTAL SAVINGS</p>
        <h2 id="total"></h2>
    </div>

</div>


<script>

    // =========================
    // EDIT YOUR SAVINGS HERE
    // =========================

    const person1 = {
        name: "Jun",
        savings: 500
    };

    const person2 = {
        name: "Arsina",
        savings: 0
    };


    // =========================
    // WEBSITE CODE
    // =========================

    document.getElementById("name1").textContent = person1.name;
    document.getElementById("name2").textContent = person2.name;

    document.getElementById("savings1").textContent =
        "₱" + person1.savings.toLocaleString();

    document.getElementById("savings2").textContent =
        "₱" + person2.savings.toLocaleString();


    // Calculate total automatically
    const totalSavings =
        person1.savings + person2.savings;

    document.getElementById("total").textContent =
        "₱" + totalSavings.toLocaleString();

</script>

</body>
</html>
