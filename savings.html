<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Gold Tracker Pro</title>

<style>

body{
font-family:Arial;
background:#0f0f0f;
color:white;
padding:30px;
}

.container{
max-width:1200px;
margin:auto;
}

h1{
text-align:center;
}

.dashboard{
display:flex;
gap:20px;
margin-top:20px;
}

.card{
flex:1;
background:#1a1a1a;
padding:15px;
border-radius:10px;
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
padding:12px;
text-align:center;
}

th{
background:#222;
cursor:pointer;
}

tr{
border-bottom:1px solid #333;
}

tr:hover{
background:#1a1a1a;
}

img{
width:60px;
border-radius:6px;
}

form{
margin-top:25px;
background:#1a1a1a;
padding:20px;
border-radius:10px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

input,button{
padding:10px;
border:none;
border-radius:6px;
}

button{
background:gold;
font-weight:bold;
cursor:pointer;
}

.next-btn{
margin-top:20px;
}

.date{
text-align:center;
color:#aaa;
margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>Gold Tracker Dashboard</h1>

<div class="date" id="date"></div>

<div class="dashboard">

<div class="card">
Total Capital
<h2 id="totalCapital">0</h2>
</div>

<div class="card">
Total Gram
<h2 id="totalGram">0</h2>
</div>

<div class="card">
Total Sussuk
<h2 id="totalSussuk">0</h2>
</div>

</div>

<form id="goldForm">

<input type="file" id="photo">

<input type="number" placeholder="Capital" id="capital" required>

<input type="number" step="0.01" placeholder="Gram" id="gram" required>

<input type="text" placeholder="Paid By (Name)" id="paid" required>

<button type="submit">Add Gold</button>

</form>

<table>

<thead>

<tr>

<th>Photo</th>
<th onclick="sortTable('capital')">Capital</th>
<th onclick="sortTable('gram')">Gram</th>
<th>Sussuk</th>
<th onclick="sortTable('price')">Price/Gram</th>
<th>Paid By</th>

</tr>

</thead>

<tbody id="tableBody"></tbody>

</table>

<button class="next-btn" onclick="nextDay()">Next Date</button>

</div>

<script>

let data = JSON.parse(localStorage.getItem("goldData")) || []

let day = 0

function render(){

let tbody = document.getElementById("tableBody")

tbody.innerHTML=""

let totalCapital=0
let totalGram=0
let totalSussuk=0

data.forEach(item=>{

let sussuk = item.gram*2.7
let price = item.capital/item.gram

totalCapital += item.capital
totalGram += item.gram
totalSussuk += sussuk

let row=`

<tr>

<td><img src="${item.photo}"></td>

<td>${item.capital}</td>

<td>${item.gram}</td>

<td>${sussuk.toFixed(2)}</td>

<td>${price.toFixed(2)}</td>

<td>${item.paid}</td>

</tr>

`

tbody.innerHTML+=row

})

document.getElementById("totalCapital").innerText = "₱"+totalCapital
document.getElementById("totalGram").innerText = totalGram.toFixed(2)
document.getElementById("totalSussuk").innerText = totalSussuk.toFixed(2)

localStorage.setItem("goldData",JSON.stringify(data))

}

document.getElementById("goldForm").onsubmit=function(e){

e.preventDefault()

let photoFile=document.getElementById("photo").files[0]

let reader=new FileReader()

reader.onload=function(){

let newItem={

photo:reader.result,
capital:parseFloat(document.getElementById("capital").value),
gram:parseFloat(document.getElementById("gram").value),
paid:document.getElementById("paid").value

}

data.push(newItem)

render()

}

reader.readAsDataURL(photoFile)

}

function sortTable(type){

data.sort((a,b)=>{

if(type=="price"){

return (a.capital/a.gram)-(b.capital/b.gram)

}

return a[type]-b[type]

})

render()

}

function nextDay(){

day++

let d=new Date()

d.setDate(d.getDate()+day)

document.getElementById("date").innerHTML=d.toDateString()

}

nextDay()

render()

</script>

</body>
</html>
