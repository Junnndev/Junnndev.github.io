<!DOCTYPE html>
<html>
<head>
    <title>Savings Goal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 350px;
            text-align: center;
        }

        h1 {
            margin-bottom: 5px;
        }

        .goal {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }

        .bar-bg {
            width: 100%;
            height: 25px;
            background: #333;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .bar-fill {
            height: 100%;
            width: 0%;
            background: #00c853;
            transition: width 0.3s ease;
        }

        .input-row {
            display: flex;
            gap: 5px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 50px;
            border: none;
            border-radius: 8px;
            font-size: 20px;
            background: #00c853;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #00e676;
        }
    </style>
</head>
<body>

<div class="container">
    <h1 id="total">₱0</h1>
    <div class="goal">Goal: ₱100,000</div>

    <div class="bar-bg">
        <div class="bar-fill" id="progressBar"></div>
    </div>

    <div class="input-row">
        <input type="number" id="amount" placeholder="Enter amount">
        <button onclick="addMoney()">+</button>
    </div>
</div>

<script>
    const GOAL = 100000;

    let total = localStorage.getItem("savingsTotal")
        ? parseFloat(localStorage.getItem("savingsTotal"))
        : 0;

    const totalDisplay = document.getElementById("total");
    const progressBar = document.getElementById("progressBar");

    function updateUI() {
        totalDisplay.innerText = "₱" + total.toLocaleString();
        let percent = (total / GOAL) * 100;
        if (percent > 100) percent = 100;
        progressBar.style.width = percent + "%";
    }

    function addMoney() {
        let amount = parseFloat(document.getElementById("amount").value);
        if (!isNaN(amount) && amount > 0) {
            total += amount;
            localStorage.setItem("savingsTotal", total);
            document.getElementById("amount").value = "";
            updateUI();
        }
    }

    updateUI();
</script>

</body>
</html>
