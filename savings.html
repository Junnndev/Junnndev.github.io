<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>₱100 × 100 Days</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7fb;color:#172033}
  .wrap{max-width:900px;margin:auto;padding:24px 16px 40px}
  header{background:#172033;color:white;border-radius:22px;padding:25px;margin-bottom:18px}
  h1{margin:0 0 5px;font-size:28px}
  .sub{opacity:.78}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
  .stat{background:#26324a;border-radius:15px;padding:13px}
  .stat b{display:block;font-size:22px}
  .progress{height:12px;background:#dfe4ee;border-radius:20px;overflow:hidden;margin-top:18px}
  .bar{height:100%;width:0;background:#46b96b;transition:.25s}
  .controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}
  button{border:0;border-radius:12px;padding:11px 15px;font-weight:700;cursor:pointer}
  .primary{background:#46b96b;color:white}
  .secondary{background:white;color:#172033;border:1px solid #dce1ea}
  .days{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .day{background:white;border:1px solid #e1e5ec;border-radius:15px;padding:13px;min-height:88px;cursor:pointer;text-align:left}
  .day.done{border-color:#46b96b;background:#effaf2}
  .day.today{box-shadow:0 0 0 3px #cfeeda}
  .num{font-size:12px;color:#667085}
  .date{font-weight:700;margin:3px 0}
  .check{font-size:23px}
  .done .check{color:#24934a}
  .empty{opacity:.45}
  .note{margin-top:16px;color:#667085;font-size:13px}
  @media(max-width:600px){.days{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:span 2}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>₱100 × 100 Days</h1>
  <div class="sub">Save ₱100 every day. Mark each real-life saving with ✓.</div>
  <div class="stats">
    <div class="stat"><span>Saved</span><b id="saved">₱0</b></div>
    <div class="stat"><span>Days</span><b id="count">0 / 100</b></div>
    <div class="stat"><span>Remaining</span><b id="remaining">₱10,000</b></div>
  </div>
  <div class="progress"><div class="bar" id="bar"></div></div>
</header>

<div class="controls">
  <button class="primary" id="todayBtn">✓ Save today — ₱100</button>
  <button class="secondary" id="remindBtn">🔔 Enable daily reminder</button>
  <button class="secondary" id="resetBtn">Reset</button>
</div>

<div class="days" id="days"></div>
<div class="note">Only today and the next day are shown. Save today and it automatically disappears, while the next day moves into today's position. Completed days cannot be undone.</div>
</div>

<script>
const TOTAL=100, AMOUNT=100;
const key="saving100x100";
let start=localStorage.getItem(key+"_start");
if(!start){ start=new Date().toISOString().slice(0,10); localStorage.setItem(key+"_start",start); }
let checked=JSON.parse(localStorage.getItem(key+"_checked")||"[]");

function dateAt(i){
  const d=new Date(start+"T00:00:00"); d.setDate(d.getDate()+i);
  return d;
}
function fmt(d){return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function save(){localStorage.setItem(key+"_checked",JSON.stringify(checked)); render();}
function render(){
  const box=document.getElementById("days"); box.innerHTML="";
  const now=new Date();
  const todayIso=now.toISOString().slice(0,10);
  const d0=new Date(start+"T00:00:00");
  const dn=new Date(todayIso+"T00:00:00");
  const todayIndex=Math.floor((dn-d0)/86400000);

  // Keep only the next two uncompleted days visible.
  const pending=[];
  for(let i=Math.max(0,todayIndex); i<TOTAL && pending.length<2; i++){
    if(!checked.includes(i)) pending.push(i);
  }

  pending.forEach((i,slot)=>{
    const d=dateAt(i);
    const isToday=i===todayIndex;
    const el=document.createElement("button");
    el.className="day"+(isToday?" today":"");
    el.innerHTML=`<div class="num">DAY ${i+1}</div>
      <div class="date">${isToday?"Today":fmt(d)}</div>
      <div class="check">₱100</div>`;
    if(isToday){
      el.onclick=()=>markToday();
    } else {
      el.disabled=true;
      el.innerHTML+=`<div class="num">Tomorrow</div>`;
    }
    box.appendChild(el);
  });

  if(pending.length===0){
    box.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:30px;background:white;border-radius:15px">🎉 100-day challenge complete!</div>';
  }

  const n=checked.length;
  document.getElementById("saved").textContent="₱"+(n*AMOUNT).toLocaleString();
  document.getElementById("count").textContent=n+" / "+TOTAL;
  document.getElementById("remaining").textContent="₱"+((TOTAL-n)*AMOUNT).toLocaleString();
  document.getElementById("bar").style.width=(n/TOTAL*100)+"%";
}

function markToday(){
  const todayIso=new Date().toISOString().slice(0,10);
  const d0=new Date(start+"T00:00:00");
  const dn=new Date(todayIso+"T00:00:00");
  const todayIndex=Math.floor((dn-d0)/86400000);
  if(todayIndex>=0 && todayIndex<TOTAL && !checked.includes(todayIndex)){
    checked.push(todayIndex);
    checked.sort((a,b)=>a-b);
    save();
  }
}

document.getElementById("todayBtn").onclick=markToday;
document.getElementById("remindBtn").onclick=async()=>{
  if(!("Notification" in window)){alert("This browser does not support notifications.");return}
  const p=await Notification.requestPermission();
  if(p==="granted"){
    localStorage.setItem(key+"_reminder","yes");
    new Notification("₱100 Daily Goal",{body:"Time to save ₱100 and mark today ✓!"});
    alert("Reminder permission enabled. For reliable daily reminders even when the page is closed, add this site to your phone's home screen or use a device/browser reminder.");
  }
};
document.getElementById("resetBtn").onclick=()=>{
  if(confirm("Reset all checkmarks and start a new 100-day challenge?")){
    start=new Date().toISOString().slice(0,10); checked=[];
    localStorage.setItem(key+"_start",start); localStorage.setItem(key+"_checked","[]"); render();
  }
};
render();
</script>
</body>
</html>
